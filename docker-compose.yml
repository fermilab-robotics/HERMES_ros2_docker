x-device-access: &device-access
  device_cgroup_rules:
    - 'c *:* rmw'
  volumes:
    - /dev:/dev

# Common ROS networking settings
x-ros-net: &ros-net
  network_mode: host
  ipc: host
  pid: host

# Common build args (must match Dockerfile ARGs)
x-build-args: &build-args
  USERNAME: ros
  USER_UID: 1000
  USER_GID: 1000

services:
  # Laptop (operator-side dev)
  laptop_dev:
    build:
      context: .
      args: *build-args

      # Which dockerfile section to use
      target: laptop_dev

    image: ros2-lyrical-laptop_dev:latest

    <<: *ros-net

    working_dir: /home/ros/ws
    user: ros

    environment:
      - ROS_DOMAIN_ID=42
      - DISPLAY=${DISPLAY:-:0}
      # Prevent Qt shared memory errors in Docker
      - QT_X11_NO_MITSHM=1
      # Forces X11 rendering for RViz2
      - QT_QPA_PLATFORM=xcb

    volumes:
      # Named volume keeps build, install, and log files cached and fast
      - laptop_build:/home/ros/ws/build
      - laptop_install:/home/ros/ws/install
      - laptop_log:/home/ros/ws/log

      # My live code source maps on top
      - ./source:/home/ros/ws/src

      # X11 socket for RViz windows
      - /tmp/.X11-unix:/tmp/.X11-unix:rw

      # For devices
      # Device cgroup rule (string that has the device type 'c for character', major id 13 for all inputdevicse, then minor id (* for all))
      - /dev:/dev
      # Pass the thinkpad's GPU/intel graphics
      - /dev/dri:/dev/dri
    
    device_cgroup_rules:
      - 'c *:* rmw'
    
  controller_dev:
    build:
      context: .
      args: *build-args
      # Which dockerfile section to use
      target: controller_dev

      
    image: ros2-lyrical-controller_dev:latest
    container_name: ros2-workspace
    <<: *ros-net
    stdin_open: true
    privileged: true # Needed for GPIO access
    tty: true
    # Placed inside the user's home directory
    working_dir: /home/ros/ws
    user: ros

    # For gpio access
    group_add:
      - gpio

    environment:
      - ROS_DOMAIN_ID=42
      # Fix bug
      - GPIOZERO_PIN_FACTORY=lgpio
      - RPI_LGPIO_CHIP=0
      - DISPLAY=${DISPLAY}

    volumes:
      # Named volume keeps build, install, and log files cached and fast
      - controller_cache:/home/ros/ws
      # My live code source maps on top
      - ./source:/home/ros/ws/src
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      # map devices 
      - /dev:/dev
    
    device_cgroup_rules:
      - 'c *:* rmw'

  robot_dev:
    build:
      # Explain this line:
      context: .
      args: *build-args

      target: robot_dev

    image: ros2-lyrical-robot_dev:latest
    # GUI and permission
    <<: *ros-net
    stdin_open: true
    tty: true
    # Placed inside the user's home directory
    working_dir: /home/ros/ws
    privileged: true
    user: ros

    # Add gpio group for gpiozero access
    group_add:
      - "986"

    environment:
      - ROS_DOMAIN_ID=42
      - GPIOZERO_PIN_FACTORY=lgpio
      - RPI_LGPIO_CHIP=0
      - DISPLAY=${DISPLAY:-:0}

    volumes:
      # Named volume keeps build, install, and log files cached and fast
      - robot_cache:/home/ros/ws

      # My live code source maps on top
      - ./source:/home/ros/ws/src

      # For devices
      # Device cgroup rule (string that has the device type 'c for character', major id 13 for all inputdevicse, then minor id (* for all))
      - /dev:/dev

    device_cgroup_rules:
      - 'c *:* rmw'
    
    # -c tells bash to execute from a string
  robot_prod:
    build:
      # Explain this line:
      context: .
      args: *build-args

      target: robot_prod

    image: ros2-lyrical-robot_prod:latest
    # GUI and permission
    <<: *ros-net
    stdin_open: true
    tty: true
    group_add:
      - "986"
    # Placed inside the user's home directory
    working_dir: /home/ros/ws
    privileged: true
    user: ros
    restart: unless-stopped
    environment:
      - ROS_DOMAIN_ID=42
      - GPIOZERO_PIN_FACTORY=lgpio
      - RPI_LGPIO_CHIP=0
      - DISPLAY=${DISPLAY:-:0}
    volumes:
      # No caches here, everything is built in the dockerfile

      # For devices
      # Device cgroup rule (string that has the device type 'c for character', major id 13 for all inputdevicse, then minor id (* for all))
      - /dev:/dev

    device_cgroup_rules:
      - 'c *:* rmw'
    
    # -c tells bash to execute from a string

volumes:
  laptop_build:
  laptop_install:
  laptop_log:
  controller_cache:
  robot_cache:
