name: Test Docker Builds

on:
  push:
    branches:
      - prod
  pull_request:

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test Build 'laptop_dev' target
        run: docker compose build laptop_dev

      - name: Test Build 'robot' target (Production)
        run: docker compose build robot_prod