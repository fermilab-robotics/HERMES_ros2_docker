controller_manager:
  ros__parameters:
    update_rate: 30
    use_sim_time: true

    diff_cont:
      type: diff_drive_controller/DiffDriveController

      

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster


diff_cont:
  ros__parameters:
    left_wheel_names: ['left_middle_wheel_joint']
    right_wheel_names: ['right_middle_wheel_joint']
    wheel_seperation: 0.35
    wheel_radius: 0.05

    use_stamped_vel: false
    base_frame_id: base_link
    publish_rate: 50.0
    odom_frame_id: odom